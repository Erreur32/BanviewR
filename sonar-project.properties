sonar.projectKey=Erreur32_BanviewR
sonar.organization=erreur32
sonar.projectName=BanviewR

sonar.sources=server,shared,web,scripts
sonar.tests=server,shared,web
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,server/db/migrations/**,web/world.json
# shortcut: no coverage report yet, add @vitest/coverage-v8 and an lcov path to gate on coverage
sonar.coverage.exclusions=**/*

sonar.sourceEncoding=UTF-8
# The scan fails when the quality gate does: the sonarcloud check then blocks the merge
sonar.qualitygate.wait=true
