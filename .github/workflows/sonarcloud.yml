name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sonarcloud:
    # Dependabot and fork PRs get no secrets
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Skipped until the SONAR_TOKEN secret is set, instead of failing every PR
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
